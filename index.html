<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HVI B2B CRM</title>
  <link rel="stylesheet" href="/src/styles/main.css">
</head>
<body>

<!-- Login gate -->
<div class="login-shell" id="loginShell">
  <div class="login-box">
    <div class="login-logo">
      <div class="co">HVI</div>
      <div class="app-name">B2B Pipeline</div>
    </div>
    <button class="btn btn-accent" id="googleLoginBtn" style="width:100%;justify-content:center">
      <svg width="16" height="16" viewBox="0 0 24 24">
        <path fill="#111" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
        <path fill="#111" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
        <path fill="#111" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
        <path fill="#111" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
      </svg>
      Continue with Google
    </button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- App shell (hidden until authenticated) -->
<div class="shell hidden" id="appShell">
  <aside class="sidebar">
    <div class="sidebar-logo">
      <div class="co">HVI</div>
      <div class="app-name">B2B Pipeline</div>
    </div>
    <nav id="sidebarNav">
      <div class="nav-item active" data-view="pipeline">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="10" rx="1"/><rect x="14" y="17" width="7" height="4" rx="1"/></svg>
        Pipeline
      </div>
      <div class="nav-item" data-view="list">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><circle cx="3" cy="6" r="1"/><circle cx="3" cy="12" r="1"/><circle cx="3" cy="18" r="1"/></svg>
        All Leads
      </div>
      <div class="nav-item" data-view="disc">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="9"/><path d="M9 8h3.5a2.5 2.5 0 0 1 0 5H9V8z"/><line x1="9" y1="16" x2="9" y2="13"/></svg>
        DISC Guide
      </div>
      <div class="nav-item" data-view="followups">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
        Follow-ups
        <span id="followupBadge" class="hidden" style="background:var(--red);color:#fff;font-size:10px;font-family:var(--mono);padding:1px 5px;border-radius:10px;margin-left:4px"></span>
      </div>
    </nav>
  </aside>

  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="viewTitle">Pipeline</div>
      <div style="display:flex;gap:10px;align-items:center">
        <div class="search-bar">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
          <input type="text" id="searchInput" placeholder="Search leads...">
        </div>
        <button class="btn btn-accent" id="addLeadBtn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Add lead
        </button>
        <div class="top-user">
          <span id="topUserEmail"></span>
          <button class="btn btn-ghost btn-sm" id="logoutBtn">Sign out</button>
        </div>
      </div>
    </div>

    <div class="content">
      <div id="pipelineView">
        <div class="kpi-grid" id="kpiRow"></div>
        <div id="pipelineFuBanner"></div>
        <div class="pipeline-grid" id="pipelineGrid"></div>
      </div>
      <div id="listView" class="hidden">
        <table class="list-table" id="listTable"></table>
      </div>
      <div id="discView" class="hidden">
        <div class="disc-guide" id="discGuide"></div>
      </div>
      <div id="followupsView" class="hidden">
        <div id="followupsContent"></div>
      </div>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal" id="modalBox"></div>
</div>

<script type="module" src="/src/main.js"></script>
</body>
</html>
